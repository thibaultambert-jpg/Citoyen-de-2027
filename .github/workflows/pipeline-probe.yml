name: Pipeline source probe

# Prints the real structure of the official sources (the agent sandbox cannot reach them).
on:
  workflow_dispatch:
  push:
    paths:
      - 'pipeline/tools/probe_sources.py'
      - 'pipeline/tools/legal_dry_run.py'
      - '.github/workflows/pipeline-probe.yml'
      - 'pipeline/eval/**'
      - 'pipeline/inputs/rag_config.json'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        source: [sponsorships]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Probe ${{ matrix.source }}
        if: matrix.source != 'j5legal'
        run: python -I pipeline/tools/probe_sources.py ${{ matrix.source }}
      - name: Cache LEGI archives
        if: matrix.source == 'j5legal'
        uses: actions/cache@v6
        with:
          path: pipeline/cache/legi
          key: legi-v1-${{ github.run_id }}
          restore-keys: legi-v1-
      - name: Legal pack dry run (real LEGI data)
        if: matrix.source == 'j5legal'
        working-directory: pipeline
        run: |
          python -m pip install --quiet -e .
          python tools/legal_dry_run.py
      - name: Set up JDK (evaluation harness)
        if: matrix.source == 'j5legal'
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
      - name: Install the NDK and CMake of :llm
        if: matrix.source == 'j5legal'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.13113456" "cmake;3.31.6" > /dev/null

      - name: Set up Gradle
        if: matrix.source == 'j5legal'
        uses: gradle/actions/setup-gradle@v6
      - name: Calibrate and evaluate retrieval on the real legal pack
        if: matrix.source == 'j5legal'
        run: |
          ./gradlew :tools:rag-eval:evaluate -Ppacks="$GITHUB_WORKSPACE/pipeline/dist" -Pcalibrate=true
          ./gradlew :tools:rag-eval:evaluate -Ppacks="$GITHUB_WORKSPACE/pipeline/dist"
