name: Publish data packs

# Manual on purpose: a human checks inputs/candidates.yaml and inputs/identities.yaml first.
# Requires the PACK_SIGNING_KEY secret (see pipeline/tools/generate_signing_key.py).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-packs
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install --quiet -e ".[dev]"
      - name: Tests
        run: python -m pytest -q
      - name: Cache LEGI archives (global archive and daily increments)
        uses: actions/cache@v4
        with:
          path: pipeline/cache/legi
          key: legi-v1-${{ github.run_id }}
          restore-keys: legi-v1-
      - name: Fetch official sources
        run: python -m citoyen_pipeline fetch --inputs inputs --cache cache
      - name: Build and sign
        env:
          PACK_SIGNING_KEY: ${{ secrets.PACK_SIGNING_KEY }}
        run: |
          test -n "$PACK_SIGNING_KEY" || { echo "::error::PACK_SIGNING_KEY secret is missing"; exit 1; }
          python -m citoyen_pipeline pack --inputs inputs --cache cache --out dist
          test -f dist/manifest.json.sig
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c "import json;print(json.load(open('dist/report.json'))['version'])")
          tag="packs-$(echo "$version" | tr '+:' '--')"
          gh release create "$tag" dist/*.sqlite dist/manifest.json dist/manifest.json.sig dist/report.json \
            --title "Données $version" --notes "Pack core $version (voir report.json)." --latest=false
          # Stable location read by the app: releases/download/packs-current/<file>.
          gh release view packs-current >/dev/null 2>&1 || \
            gh release create packs-current --title "Données actuelles" --notes "Dernier pack publié." --latest=false
          gh release upload packs-current dist/*.sqlite dist/manifest.json dist/manifest.json.sig --clobber
