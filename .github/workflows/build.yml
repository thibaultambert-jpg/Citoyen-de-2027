name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'ccr-*'
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint, tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check build-logic
        run: ./gradlew :build-logic:convention:check

      - name: Check formatting (ktlint)
        run: ./gradlew spotlessCheck

      - name: Unit tests (incl. neutrality scan)
        run: ./gradlew test --continue

      - name: Android Lint
        run: ./gradlew lint

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      - name: Compile release (no fixtures in release)
        run: ./gradlew :app:compileReleaseKotlin

      - name: Report APK size
        run: |
          ls -l app/build/outputs/apk/debug/
          du -h app/build/outputs/apk/debug/*.apk

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
            core/database/schemas/
          retention-days: 7
