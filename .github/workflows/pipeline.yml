name: Pipeline

on:
  workflow_dispatch:
  push:
    paths:
      - 'config/neutrality/**'
      - 'pipeline/**'
      - 'core/data/src/test/resources/packs/**'
      - '.github/workflows/pipeline.yml'
  pull_request:
    paths:
      - 'config/neutrality/**'
      - 'pipeline/**'
      - 'core/data/src/test/resources/packs/**'

permissions:
  contents: read

jobs:
  test:
    name: Lint and tests (no network)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install --quiet -e ".[dev]"
      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Tests
        run: python -m pytest -q
