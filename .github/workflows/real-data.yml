name: Real data

# Personal use (AGENTS.md §1 bis). Every night, and on demand:
# 1. prepares the inputs from the open data of « 2027 et moi » (Licence Ouverte 2.0);
# 2. builds the packs from the OFFICIAL sources, keeping only the identities they confirm and
#    leaving out (with a note in report.json) a source that fails;
# 3. signs them with the publisher's key (secret PACK_SIGNING_KEY), checks them with the public key
#    the app embeds (variable CITOYEN_PACKS_PUBLIC_KEY) and publishes them on the release
#    "packs-current", from which the installed app refreshes its data (at launch and daily, on Wi-Fi);
# 4. builds a test APK holding these packs, for a first installation with data.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/real-data.yml'
      - 'pipeline/citoyen_pipeline/**'

concurrency:
  group: real-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  data:
    name: Import, build, publish packs and test APK
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install the pipeline
        working-directory: pipeline
        run: python -m pip install --quiet -e .

      - name: Signing key and public key match (values never printed)
        env:
          PACK_SIGNING_KEY: ${{ secrets.PACK_SIGNING_KEY }}
          PACK_PUBLIC_KEY: ${{ vars.CITOYEN_PACKS_PUBLIC_KEY }}
        run: |
          python - <<'PY'
          import base64, os, sys
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          from cryptography.hazmat.primitives.serialization import Encoding, PublicFormat
          secret, public = os.environ["PACK_SIGNING_KEY"].strip(), os.environ["PACK_PUBLIC_KEY"].strip()
          if not secret or not public:
              sys.exit("Missing secret PACK_SIGNING_KEY or variable CITOYEN_PACKS_PUBLIC_KEY (docs/release.md).")
          try:
              key = Ed25519PrivateKey.from_private_bytes(base64.b64decode(secret))
          except Exception:
              sys.exit("PACK_SIGNING_KEY is not a base64 Ed25519 key of 32 bytes.")
          derived = base64.b64encode(key.public_key().public_bytes(Encoding.Raw, PublicFormat.Raw)).decode()
          if derived != public:
              sys.exit("CITOYEN_PACKS_PUBLIC_KEY does not match PACK_SIGNING_KEY.")
          print("Signing key and public key match.")
          PY

      - name: Get the « 2027 et moi » open data
        run: git clone --quiet --depth 1 https://github.com/2027etmoi/2027etmoi "$RUNNER_TEMP/2027etmoi"

      - name: Prepare the inputs (candidates, identities, programmes)
        working-directory: pipeline
        run: python -m citoyen_pipeline import-2027etmoi --source "$RUNNER_TEMP/2027etmoi" --network

      - name: Cache LEGI archives
        uses: actions/cache@v6
        with:
          path: pipeline/cache/legi
          key: legi-v1-${{ github.run_id }}
          restore-keys: legi-v1-

      - name: Fetch official sources (a failing source is reported and left out)
        working-directory: pipeline
        run: python -m citoyen_pipeline fetch --inputs inputs --cache cache --keep-going

      - name: Build, sign and check as the app will
        working-directory: pipeline
        env:
          PACK_SIGNING_KEY: ${{ secrets.PACK_SIGNING_KEY }}
          PACK_PUBLIC_KEY: ${{ vars.CITOYEN_PACKS_PUBLIC_KEY }}
        run: |
          python -m citoyen_pipeline pack --inputs inputs --cache cache --out dist --lenient-identities
          python -m citoyen_pipeline verify --dist dist

      - name: Data report and generated inputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: data-report
          path: |
            pipeline/dist/report.json
            pipeline/inputs/candidates.yaml
            pipeline/inputs/identities.yaml
            pipeline/inputs/programs/manifest.yaml
            pipeline/inputs/import-review.json
          retention-days: 30

      - name: Publish on packs-current (packs first, manifest last)
        working-directory: pipeline/dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < upload-order.txt
          if ! gh release view packs-current > /dev/null 2>&1; then
            gh release create packs-current --target "$GITHUB_SHA" --latest=false \
              --title "Packs de données (version courante)" \
              --notes "Données synchronisées par l’application. Ne pas supprimer."
          fi
          # One file at a time, manifest last: an app syncing mid-upload refuses the hash mismatch
          # and installs at its next sync.
          for file in "${files[@]}" report.json; do
            gh release upload packs-current "$file" --clobber
          done

      - name: Embed the packs in the test APK
        run: |
          mkdir -p app/src/debug/assets/packs
          while read -r file; do cp "pipeline/dist/$file" app/src/debug/assets/packs/; done < pipeline/dist/upload-order.txt

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21
      - name: Install the NDK and CMake of :llm
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.13113456" "cmake;3.31.6" > /dev/null
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Retrieval evaluation on the golden set (information only)
        continue-on-error: true
        run: ./gradlew :tools:rag-eval:evaluate -Ppacks="$GITHUB_WORKSPACE/pipeline/dist"

      - name: Assemble the test APK
        env:
          PACK_PUBLIC_KEY: ${{ vars.CITOYEN_PACKS_PUBLIC_KEY }}
        run: ./gradlew :app:assembleDebug -Pcitoyen.packs.publicKey="$PACK_PUBLIC_KEY"

      - name: Test APK with real data
        uses: actions/upload-artifact@v7
        with:
          name: citoyen-2027-real-data-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
