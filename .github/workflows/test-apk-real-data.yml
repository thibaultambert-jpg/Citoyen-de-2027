name: Test APK with real data

# Personal use (AGENTS.md §1 bis): one button for a test APK holding real data.
# 1. Prepares the inputs from the open data of « 2027 et moi » (Licence Ouverte 2.0).
# 2. Builds the packs from the OFFICIAL sources (AN, Sénat, PE, RNE, vie-publique, LEGI, programmes),
#    keeping only the identities those sources confirm (--lenient-identities).
# 3. Signs them with a key generated inside this job and thrown away with it (never stored, never
#    printed), embeds them in the debug APK built with the matching public key.
# The APK therefore cannot sync later packs: run this workflow again for fresher data.
on:
  workflow_dispatch:
  # Also runs when this workflow or the pipeline code changes (manual runs need the file on main).
  push:
    paths:
      - '.github/workflows/test-apk-real-data.yml'
      - 'pipeline/citoyen_pipeline/**'

concurrency:
  group: test-apk-real-data
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    name: Import, build packs, test APK
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install the pipeline
        working-directory: pipeline
        run: python -m pip install --quiet -e .

      - name: Get the « 2027 et moi » open data
        run: git clone --quiet --depth 1 https://github.com/2027etmoi/2027etmoi "$RUNNER_TEMP/2027etmoi"

      - name: Prepare the inputs (candidates, identities, programmes)
        working-directory: pipeline
        run: python -m citoyen_pipeline import-2027etmoi --source "$RUNNER_TEMP/2027etmoi" --network

      - name: Cache LEGI archives
        uses: actions/cache@v6
        with:
          path: pipeline/cache/legi
          key: legi-v1-${{ github.run_id }}
          restore-keys: legi-v1-

      - name: Fetch official sources
        working-directory: pipeline
        run: python -m citoyen_pipeline fetch --inputs inputs --cache cache

      - name: Build and sign with a throwaway key
        working-directory: pipeline
        run: |
          read -r PACK_SIGNING_KEY PUBLIC_KEY < <(python - <<'PY'
          import base64
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          from cryptography.hazmat.primitives.serialization import Encoding, NoEncryption, PrivateFormat, PublicFormat
          key = Ed25519PrivateKey.generate()
          private = key.private_bytes(Encoding.Raw, PrivateFormat.Raw, NoEncryption())
          public = key.public_key().public_bytes(Encoding.Raw, PublicFormat.Raw)
          print(base64.b64encode(private).decode(), base64.b64encode(public).decode())
          PY
          )
          echo "::add-mask::$PACK_SIGNING_KEY"
          PACK_SIGNING_KEY="$PACK_SIGNING_KEY" python -m citoyen_pipeline pack --inputs inputs --cache cache \
            --out dist --lenient-identities
          python -m citoyen_pipeline verify --dist dist --public-key "$PUBLIC_KEY"
          echo "PACKS_PUBLIC_KEY=$PUBLIC_KEY" >> "$GITHUB_ENV"

      - name: Embed the packs in the debug APK
        run: |
          mkdir -p app/src/debug/assets/packs
          while read -r file; do cp "pipeline/dist/$file" app/src/debug/assets/packs/; done < pipeline/dist/upload-order.txt
          ls -l app/src/debug/assets/packs

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21
      - name: Install the NDK and CMake of :llm
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.13113456" "cmake;3.31.6" > /dev/null
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Retrieval evaluation on the golden set (information only)
        continue-on-error: true
        run: ./gradlew :tools:rag-eval:evaluate -Ppacks="$GITHUB_WORKSPACE/pipeline/dist"

      - name: Assemble the debug APK
        run: ./gradlew :app:assembleDebug -Pcitoyen.packs.publicKey="$PACKS_PUBLIC_KEY"

      - name: Test APK with real data
        uses: actions/upload-artifact@v7
        with:
          name: citoyen-2027-real-data-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Data report and generated inputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: data-report
          path: |
            pipeline/dist/report.json
            pipeline/inputs/candidates.yaml
            pipeline/inputs/identities.yaml
            pipeline/inputs/programs/manifest.yaml
            pipeline/inputs/import-review.json
          retention-days: 30
